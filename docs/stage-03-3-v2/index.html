<!-- Specimen controls (not part of the website) -->
<div class="sp" id="sp" role="region" aria-label="Specimen controls">
  <span class="sp-id"><b>Al Aliah · Stage 03.3 v2</b><small>Design specimen · not a live site</small></span>
  <div class="sp-g" id="sp-pages" role="group" aria-label="Page">
    <button type="button" data-go="home">Homepage</button>
    <button type="button" data-go="search">Search / Buy</button>
    <button type="button" data-go="property">Property detail</button>
    <button type="button" data-go="area">Area: Yas Island</button>
  </div>
  <div class="sp-g" id="sp-state" role="group" aria-label="Listing" hidden>
    <button type="button" data-prop="31521">Ready villa · rent</button>
    <button type="button" data-prop="31094">Off-plan · sale</button>
    <button type="button" data-prop="31495">Ready villa · sale</button>
    <button type="button" data-prop="31013">Sparse (AA-1004)</button>
  </div>
  <div class="sp-g" id="sp-permit" role="group" aria-label="Permit block" hidden>
    <button type="button" data-permit="ph">Permit: placeholder</button>
    <button type="button" data-permit="none">Permit: none (real data)</button>
  </div>
  <span class="sp-sp"></span>
  <button type="button" class="sp-b" id="sp-replay" hidden>Replay intro</button>
  <div class="sp-g" id="sp-view" role="group" aria-label="Viewport">
    <button type="button" data-view="desktop">Desktop</button>
    <button type="button" data-view="mobile">Mobile 390</button>
  </div>
  <button type="button" class="sp-b" id="sp-notes" aria-expanded="false" aria-controls="notes">Notes</button>
</div>
<aside class="notes" id="notes" aria-label="Design notes" hidden>
  <button type="button" class="notes-x" id="notes-x"><svg class="i"><use href="#i-close"/></svg><span class="vh">Close notes</span></button>
  <div id="notes-body"></div>
</aside>

<div class="stage" id="stage" data-view="desktop">
<div class="site" id="site" data-page="home">

  <a class="skip" href="#main">Skip to content</a>

  <header class="hdr" id="hdr">
    <div class="hdr-in">
      <a class="logo" href="#home" aria-label="Al Aliah International, home">
        <img class="logo-w" src="logo/alaliah-h-white.png" alt="" width="669" height="148">
        <img class="logo-k" src="logo/alaliah-h-crimson.png" alt="" width="669" height="148">
      </a>
      <nav class="nav" aria-label="Main">
        <ul>
          <li><button type="button" class="nav-b" data-mega="buy" aria-expanded="false" aria-controls="mega">Buy<svg class="i"><use href="#i-chev"/></svg></button></li>
          <li><button type="button" class="nav-b" data-mega="rent" aria-expanded="false" aria-controls="mega">Rent<svg class="i"><use href="#i-chev"/></svg></button></li>
          <li><button type="button" class="nav-b" data-mega="offplan" aria-expanded="false" aria-controls="mega">Off-Plan<svg class="i"><use href="#i-chev"/></svg></button></li>
          <li><button type="button" class="nav-b" data-mega="areas" aria-expanded="false" aria-controls="mega">Areas<svg class="i"><use href="#i-chev"/></svg></button></li>
          <li><button type="button" class="nav-b" data-mega="developers" aria-expanded="false" aria-controls="mega">Developers<svg class="i"><use href="#i-chev"/></svg></button></li>
          <li><a class="nav-b" href="#about" data-todo="About Us is outside this specimen's four pages.">About Us</a></li>
        </ul>
      </nav>
      <div class="hdr-act">
        <button type="button" class="hdr-sl" id="hdr-sl" aria-label="Shortlist, 0 homes"><svg class="i"><use href="#i-heart"/></svg><span class="n" id="sl-n">0</span></button>
        <a class="hdr-list" href="#home" data-scroll="advice">List your property</a>
        <button type="button" class="hdr-wa" data-wa="general"><svg class="i"><use href="#i-wa"/></svg><span>WhatsApp</span></button>
        <button type="button" class="btn hdr-cta" data-enquire="general">Contact</button>
        <button type="button" class="hdr-menu" id="hdr-menu" aria-haspopup="dialog"><svg class="i"><use href="#i-menu"/></svg><span>Menu</span></button>
      </div>
    </div>
    <div class="mega" id="mega" hidden></div>
  </header>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main" tabindex="-1"></main>

  <footer class="ft" id="ft"></footer>

  <!-- Mobile quick bar (home, search, area); the property page has its own contact bar -->
  <nav class="mtab" id="mtab" aria-label="Quick links">
    <a href="#search/sale"><svg class="i"><use href="#i-search"/></svg><span>Search</span></a>
    <a href="#search/offplan"><svg class="i"><use href="#i-grid"/></svg><span>Off-Plan</span></a>
    <button type="button" id="mt-sl"><svg class="i"><use href="#i-heart"/></svg><span>Shortlist</span><b class="n zero" id="mt-n">0</b></button>
    <button type="button" class="wa" data-wa="general"><svg class="i"><use href="#i-wa"/></svg><span>WhatsApp</span></button>
    <button type="button" id="mt-menu"><svg class="i"><use href="#i-menu"/></svg><span>Menu</span></button>
  </nav>
</div>
